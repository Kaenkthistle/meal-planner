[package]
name = "kaenkthistle/cookbook-app"
version = "0.1.6"
description = "Cookbook Vue application"
private = true

[dependencies]
"wasmer/static-web-server" = "^1"

[fs]
"/public" = "dist"
"/settings" = "settings"

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["-w", "/settings/config.toml"]
